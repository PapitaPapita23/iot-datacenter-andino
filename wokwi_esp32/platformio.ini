; ============================================================================
; Compilación local del firmware para Wokwi for VS Code (PlatformIO)
; Compilar:  python -m platformio run            (entorno "nube", por defecto)
;            python -m platformio run -e local   (broker Mosquitto propio)
; ============================================================================

[platformio]
src_dir = .
default_envs = nube

[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_src_filter = +<*> -<.git/> -<.pio/>
lib_deps =
    knolleary/PubSubClient@^2.8
    beegee-tokyo/DHT sensor library for ESPx@^1.19

; Broker público test.mosquitto.org (mismo comportamiento que en wokwi.com)
[env:nube]

; Broker Mosquitto instalado en este equipo.
; Desde la simulación de Wokwi for VS Code, el equipo anfitrión es host.wokwi.internal
[env:local]
build_flags = -D MQTT_BROKER_HOST=\"host.wokwi.internal\"
