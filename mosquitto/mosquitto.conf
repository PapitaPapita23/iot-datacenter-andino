# ============================================================================
# Configuración del broker Eclipse Mosquitto - DataCenter Andino S.A.C.
# Broker local del prototipo (Windows, sin contenedores).
#
# Cómo aplicarla (PowerShell como administrador):
#   New-Item -ItemType Directory -Force C:\ProgramData\mosquitto
#   Copy-Item mosquitto\mosquitto.conf "C:\Program Files\mosquitto\mosquitto.conf"
#   Restart-Service mosquitto
# ============================================================================

# Escucha solo en este equipo (IPv4 e IPv6), en el puerto MQTT estándar
listener 1883 127.0.0.1
listener 1883 ::1

# Prototipo académico: conexión sin usuario ni contraseña
allow_anonymous true

# Registro de conexiones y desconexiones de los clientes
log_dest file C:\ProgramData\mosquitto\mosquitto.log
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
log_timestamp true
log_timestamp_format %Y-%m-%dT%H:%M:%S

# ============================================================================
# Evolución a Entorno Productivo (TLS en el puerto 8883 + Autenticación + ACLs)
# ============================================================================
# listener 8883 0.0.0.0
# allow_anonymous false
# password_file C:\ProgramData\mosquitto\passwd
# acl_file C:\ProgramData\mosquitto\acl.conf
# cafile C:\ProgramData\mosquitto\certs\ca.crt
# certfile C:\ProgramData\mosquitto\certs\server.crt
# keyfile C:\ProgramData\mosquitto\certs\server.key
# tls_version tlsv1.3
