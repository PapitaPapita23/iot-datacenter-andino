# ============================================================================
# Configuración de Broker MQTT Eclipse Mosquitto - DataCenter Andino S.A.C.
# Nota: El prototipo usa por defecto el broker público test.mosquitto.org:1883.
# Este archivo permite desplegar un broker Mosquitto propio sin contenedores.
# ============================================================================

persistence true
persistence_location /var/lib/mosquitto/
log_dest file /var/log/mosquitto/mosquitto.log
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
log_timestamp true
log_timestamp_format %Y-%m-%dT%H:%M:%S

listener 1883 0.0.0.0
allow_anonymous true

