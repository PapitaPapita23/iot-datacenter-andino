# Configuración de Wokwi for VS Code.
# El firmware se genera con PlatformIO (ver platformio.ini).
# Para simular contra el broker público de pruebas, cambie "local" por "publico" en las dos rutas.

[wokwi]
version = 1
firmware = '.pio/build/local/firmware.bin'
elf = '.pio/build/local/firmware.elf'
